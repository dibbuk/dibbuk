[project]
name = "dibbuk"
version = "0.1.0"
description = "Telegram-бот, который режет любую картинку в эмодзи-пак"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
dibbuk = "bot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
